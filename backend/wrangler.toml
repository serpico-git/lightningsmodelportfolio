name = "mpf-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "PORTFOLIO_CACHE", id = "21047972a85d42f4b725057f74c1cf58" }
]

[triggers]
# every 30 min: LTP only (cheap, fast-changing)
# every 2 days (approx, resets at month boundary): full history + sector + dividend calendar
crons = ["*/30 * * * *", "0 */3 * * *"]